<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Beispiel: Vorspann in einer Vorschau-Seite</title>
<!-- Diese eine Zeile bindet den Vorspann ein: -->
<script src="vorspann.js" data-firma="Guido Pagenstecher Hausverwaltung" data-suche="Hausverwaltung Berlin" data-telefon="0178 4448118"></script>
<style>
  body { margin: 0; font: 17px/1.5 system-ui, sans-serif; color: #1E2023; background: #fff; }
  .balken { display: flex; justify-content: space-between; gap: 12px; padding: 10px 16px; background: #F0B400; font-size: 15px; }
  .balken a { color: inherit; font-weight: 600; }
  main { padding: 32px 16px; max-width: 40em; margin: 0 auto; }
  h1 { font-size: 30px; line-height: 1.15; }
</style>
</head>
<body>
  <div class="balken"><span><strong>Entwurf,</strong> nicht öffentlich.</span> <a href="#vorspann">Wer hat das gebaut?</a></div>
  <main>
    <h1>Guido Pagenstecher Hausverwaltung</h1>
    <p>Platzhalter für die Vorschau-Seite des Kunden. Der Vorspann läuft beim ersten Öffnen. Der Link oben rechts spielt ihn noch einmal ab.</p>
    <p>Zum Testen: <a href="?vorspann=1">immer abspielen</a> · <a href="?b=2">kurze Fassung wie im zweiten Brief</a></p>
  </main>
</body>
</html>
