<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#15171A">
<title>Chip und Schraube · Vorspann (Entwurf)</title>
<style>
/* ==========================================================================
   Chip und Schraube – Vorspann für die Akquise-Seiten (Entwurf)
   Ablauf: Chip erscheint → Schraube dreht sich ein → Schlitz leuchtet gelb →
   Logo rückt nach oben → Vorstellung und Kernaussage → Button.
   Reines CSS/SVG, keine Bibliothek, keine Bilder.
   ========================================================================== */
:root {
  --blatt: #15171A; --tinte: #1E2023; --stahl: #3B3F45; --grau: #E5E5E1;
  --leise: #A9ADB3; --gelb: #F0B400; --gelb-hell: #FFC933;
  --kopf: "Archivo", "Helvetica Neue", "Arial Narrow", Arial, sans-serif;
  --text: "Barlow", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --tafel: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--grau); color: var(--tinte); font-family: var(--text); }

/* Platzhalter für die Kundenseite, die nach dem Vorspann aufgeht */
.dahinter { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 32px; text-align: center; }
.dahinter p { margin: 0; font-size: 18px; max-width: 22em; }
.dahinter button { font: inherit; font-weight: 600; padding: 14px 22px; border: 2px solid var(--tinte); border-radius: 8px; background: none; color: var(--tinte); cursor: pointer; }

/* ---------- Tafel ---------- */
.vorspann {
  position: fixed; inset: 0; z-index: 1000; overflow: hidden; color: var(--grau);
  background: radial-gradient(120% 70% at 50% 38%, #262a30 0%, var(--blatt) 62%);
  transition: transform .9s cubic-bezier(.7, 0, .2, 1);
}
.vorspann.zu { transform: translateY(-100%); }
.vorspann :focus-visible { outline: 2px solid var(--gelb-hell); outline-offset: 3px; }
.ueberspringen { position: absolute; z-index: 2; top: calc(10px + env(safe-area-inset-top, 0px)); right: 10px; padding: 12px; font: inherit; font-size: 14px; color: var(--leise); background: none; border: 0; cursor: pointer; }

/* ---------- 3D-Logo ---------- */
.logo {
  position: absolute; left: 50%; top: 46%; width: 300px; height: 300px; margin: -150px 0 0 -150px; perspective: 900px;
  transition: top .9s cubic-bezier(.6, 0, .2, 1), transform .9s cubic-bezier(.6, 0, .2, 1);
}
.s4 .logo { top: 15%; transform: scale(.56); }

.ring { position: absolute; left: 50%; top: 50%; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%; border: 2px solid var(--gelb); opacity: 0; }
.s3 .ring { animation: ring .9s ease-out; }

.schraube { position: absolute; left: 50%; top: 50%; width: 46px; height: 190px; margin-left: -23px; overflow: visible; opacity: 0; transform: translateY(150px); transition: transform 1.5s cubic-bezier(.2, .7, .2, 1), opacity .4s; }
.s1 .schraube { opacity: 1; transform: none; }
.gewinde { animation: lauf .2s linear infinite; animation-play-state: paused; }
.s1 .gewinde { animation-play-state: running; }
.s2 .gewinde { animation-duration: .5s; }
.s3 .gewinde { animation-play-state: paused; }

.modell { position: absolute; left: 50%; top: 50%; width: 170px; height: 110px; margin: -55px 0 0 -85px; transform-style: preserve-3d; transform: rotateX(60deg) rotateZ(-35deg); opacity: 0; }
.s0 .modell { opacity: 1; animation: ein .9s cubic-bezier(.2, .7, .2, 1) both; }
.s2 .modell { animation: dreh 1s cubic-bezier(.3, .6, .2, 1) both; }
.koerper { position: absolute; inset: 0; transform-style: preserve-3d; }
.s3 .koerper { animation: druck .4s ease-out; }

.oben { position: absolute; inset: 0; transform: translateZ(28px); border-radius: 3px; background: linear-gradient(135deg, #5b6068 0%, #3a3e44 70%); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16); }
.oben::before { content: ""; position: absolute; left: 10px; top: 10px; width: 9px; height: 9px; border-radius: 50%; background: rgba(0, 0, 0, .35); }
.schlitz { position: absolute; left: 27%; right: 27%; top: 50%; height: 14px; margin-top: -7px; border-radius: 7px; background: #5d4f1c; transition: background .25s, box-shadow .5s; }
.s3 .schlitz { background: var(--gelb-hell); box-shadow: 0 0 22px 6px rgba(240, 180, 0, .65); }
.wand { position: absolute; background: #24272c; }
.wand--v, .wand--h { left: 0; width: 100%; height: 28px; transform-origin: top; transform: rotateX(90deg); }
.wand--v { top: 100%; background: linear-gradient(#2c3036, #1c1e22); }
.wand--h { top: 0; }
.wand--l, .wand--r { top: 0; width: 28px; height: 100%; transform-origin: left; transform: rotateY(-90deg); }
.wand--l { left: 0; background: #1a1c1f; }
.wand--r { left: 100%; background: linear-gradient(90deg, #17191c, #2a2d32); }
.bein { position: absolute; width: 16px; height: 16px; transform-style: preserve-3d; transform: translateZ(14px); background: linear-gradient(#eceef0, #a4a9b0); }
.bein::after { content: ""; position: absolute; top: 0; width: 14px; height: 100%; background: #7d828a; transform-origin: left; transform: rotateY(90deg); }
.bein--l { left: -16px; } .bein--l::after { left: 0; }
.bein--r { left: 100%; } .bein--r::after { left: 100%; }
.bein--1 { top: 20px; } .bein--2 { top: 74px; }

@keyframes ein { from { opacity: 0; transform: rotateX(60deg) rotateZ(-95deg) translateZ(70px); } to { opacity: 1; transform: rotateX(60deg) rotateZ(-35deg); } }
@keyframes dreh { from { transform: rotateX(60deg) rotateZ(-35deg); } to { transform: rotateX(60deg) rotateZ(-395deg); } }
@keyframes druck { 0% { transform: translateZ(0); } 35% { transform: translateZ(-9px); } 100% { transform: translateZ(0); } }
@keyframes lauf { to { transform: translateY(16px); } }
@keyframes ring { from { opacity: .9; transform: scaleY(.5) scale(.5); } to { opacity: 0; transform: scaleY(.5) scale(3); } }

/* ---------- Text ---------- */
.inhalt {
  position: absolute; left: 0; right: 0; top: 34%; bottom: 0; margin: 0 auto; max-width: 460px;
  padding: 0 24px calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.auf { opacity: 0; transform: translateY(12px); transition: opacity .6s, transform .6s cubic-bezier(.2, .7, .2, 1); }
.s5 .auf--5, .s6 .auf--6, .s7 .auf--7, .s8 .auf--8, .s9 .auf--9 { opacity: 1; transform: none; }

.marke { margin: 0; font-family: var(--kopf); font-weight: 800; font-size: 25px; letter-spacing: -.02em; line-height: 1.1; }
.marke small { display: block; margin-top: 6px; font-family: var(--tafel); font-weight: 500; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--leise); }
.satz { margin: 18px 0 0; font-size: 17px; line-height: 1.4; }
.satz strong { font-weight: 600; color: #fff; }

.klapptafel { margin-top: 18px; width: 100%; padding: 8px; border-radius: 8px; background: var(--stahl); display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.kachel { position: relative; aspect-ratio: 3 / 4; display: grid; place-items: center; border-radius: 3px; background: #17191c; color: var(--grau); font-family: var(--tafel); font-weight: 700; font-size: clamp(18px, 6vw, 28px); line-height: 1; perspective: 200px; }
.kachel::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0, 0, 0, .7); }
.kachel--gelb { color: var(--gelb-hell); }

.los { margin-top: auto; width: 100%; min-height: 54px; padding: 0 24px; border: 0; border-radius: 8px; background: var(--gelb); color: var(--tinte); font: inherit; font-size: 18px; font-weight: 700; cursor: pointer; }
.los:hover { background: var(--gelb-hell); }

@media (min-height: 760px) { .satz { margin-top: 22px; } .klapptafel { margin-top: 24px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<main class="dahinter">
  <p>Hier geht nach dem Vorspann die Seite des Kunden auf.</p>
  <button type="button" id="nochmal">Vorspann noch einmal abspielen</button>
</main>

<div class="vorspann" id="vorspann" role="dialog" aria-modal="true" aria-label="Kurz vorab: Wer wir sind und wofür diese Seite gebaut ist">
  <button class="ueberspringen" type="button" id="ueberspringen">Überspringen</button>

  <div class="logo" aria-hidden="true">
    <div class="ring"></div>
    <svg class="schraube" viewBox="0 0 46 190">
      <defs>
        <linearGradient id="metall" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#2a2d32"/><stop offset=".28" stop-color="#9a9fa6"/><stop offset=".45" stop-color="#e6e8ea"/>
          <stop offset=".7" stop-color="#737880"/><stop offset="1" stop-color="#22252a"/>
        </linearGradient>
        <clipPath id="schaft"><path d="M0 0H46V150L23 190 0 150Z"/></clipPath>
      </defs>
      <path d="M0 0H46V150L23 190 0 150Z" fill="url(#metall)"/>
      <g clip-path="url(#schaft)">
        <g class="gewinde" fill="none" stroke-linecap="round">
          <g stroke="#15171A" stroke-opacity=".8" stroke-width="3.5">
            <path d="M-2 -24Q23 -8 48 -32"/><path d="M-2 -8Q23 8 48 -16"/><path d="M-2 8Q23 24 48 0"/><path d="M-2 24Q23 40 48 16"/><path d="M-2 40Q23 56 48 32"/><path d="M-2 56Q23 72 48 48"/><path d="M-2 72Q23 88 48 64"/><path d="M-2 88Q23 104 48 80"/><path d="M-2 104Q23 120 48 96"/><path d="M-2 120Q23 136 48 112"/><path d="M-2 136Q23 152 48 128"/><path d="M-2 152Q23 168 48 144"/><path d="M-2 168Q23 184 48 160"/><path d="M-2 184Q23 200 48 176"/>
          </g>
          <g stroke="#fff" stroke-opacity=".35" stroke-width="1" transform="translate(0 3)">
            <path d="M-2 -24Q23 -8 48 -32"/><path d="M-2 -8Q23 8 48 -16"/><path d="M-2 8Q23 24 48 0"/><path d="M-2 24Q23 40 48 16"/><path d="M-2 40Q23 56 48 32"/><path d="M-2 56Q23 72 48 48"/><path d="M-2 72Q23 88 48 64"/><path d="M-2 88Q23 104 48 80"/><path d="M-2 104Q23 120 48 96"/><path d="M-2 120Q23 136 48 112"/><path d="M-2 136Q23 152 48 128"/><path d="M-2 152Q23 168 48 144"/><path d="M-2 168Q23 184 48 160"/><path d="M-2 184Q23 200 48 176"/>
          </g>
        </g>
      </g>
    </svg>
    <div class="modell">
      <div class="koerper">
        <div class="wand wand--h"></div><div class="wand wand--l"></div><div class="wand wand--r"></div><div class="wand wand--v"></div>
        <div class="bein bein--l bein--1"></div><div class="bein bein--l bein--2"></div>
        <div class="bein bein--r bein--1"></div><div class="bein bein--r bein--2"></div>
        <div class="oben"><div class="schlitz"></div></div>
      </div>
    </div>
  </div>

  <div class="inhalt">
    <p class="marke auf auf--5">Chip und Schraube<small>Webseiten aus Berlin-Wedding</small></p>
    <p class="satz auf auf--6">Wir haben Ihre Webseite neu gebaut. <strong>Nicht, damit sie schöner aussieht.</strong> Ihre jetzige kann bleiben, wie sie ist.</p>
    <div class="klapptafel auf auf--7" id="klapptafel" role="img" aria-label="Es geht um Anfragen"></div>
    <p class="satz auf auf--8">Damit Kunden Sie bei Google finden und sich bei Ihnen melden.</p>
    <button class="los auf auf--9" type="button" id="los">Entwurf ansehen</button>
  </div>
</div>

<script>
(function () {
  var tafel = document.getElementById('vorspann');
  var klapp = document.getElementById('klapptafel');
  var ruhig = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ZEILEN = ['ES GEHT UM', 'ANFRAGEN  '];          // je 10 Felder
  var ABLAUF = [[0, 's0'], [500, 's1'], [2000, 's2'], [3000, 's3'], [3600, 's4'], [4100, 's5'], [4600, 's6'], [5600, 's7'], [7000, 's8'], [7400, 's9']];
  var ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var timer = [];

  function später(fn, ms) { timer.push(setTimeout(fn, ms)); }

  function kachelnBauen() {
    klapp.textContent = '';
    ZEILEN.forEach(function (zeile, z) {
      zeile.split('').forEach(function (ziel) {
        var k = document.createElement('span');
        k.className = 'kachel' + (z === 1 ? ' kachel--gelb' : '');
        k.dataset.ziel = ziel === ' ' ? '' : ziel;
        k.setAttribute('aria-hidden', 'true');
        klapp.appendChild(k);
      });
    });
  }

  function klappen() {
    Array.prototype.forEach.call(klapp.children, function (k, i) {
      if (!k.dataset.ziel || ruhig) { k.textContent = k.dataset.ziel; return; }
      var runden = 3 + (i % 4);
      for (var r = 0; r <= runden; r++) {
        (function (r) {
          später(function () {
            k.textContent = r === runden ? k.dataset.ziel : ABC[Math.floor(Math.random() * 26)];
            if (k.animate) k.animate([{ transform: 'rotateX(-80deg)' }, { transform: 'none' }], { duration: 90 });
          }, i * 45 + r * 95);
        })(r);
      }
    });
  }

  function start() {
    timer.forEach(clearTimeout); timer = [];
    tafel.className = 'vorspann';
    kachelnBauen();
    void tafel.offsetWidth;                            // Animationen sauber neu starten
    ABLAUF.forEach(function (schritt) {
      später(function () {
        tafel.classList.add(schritt[1]);
        if (schritt[1] === 's7') klappen();
      }, ruhig ? 0 : schritt[0]);
    });
  }

  function schliessen() { timer.forEach(clearTimeout); tafel.classList.add('zu'); }

  document.getElementById('los').addEventListener('click', schliessen);
  document.getElementById('ueberspringen').addEventListener('click', schliessen);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') schliessen(); });
  document.getElementById('nochmal').addEventListener('click', start);
  start();
})();
</script>
</body>
</html>
